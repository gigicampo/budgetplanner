<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
 <title id="title">Budget Planner app icon</title>
 <desc id="desc">A sage wallet holding a segmented budget chart with a heart, surrounded by soft leaves on an ivory rounded-square background.</desc>
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdfa"/><stop offset="1" stop-color="#f2eee8"/></linearGradient>
  <linearGradient id="wallet" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#a9beb3"/><stop offset=".48" stop-color="#96aca0"/><stop offset="1" stop-color="#788e83"/></linearGradient>
  <linearGradient id="walletRim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b9cec2"/><stop offset="1" stop-color="#768b80"/></linearGradient>
  <linearGradient id="strap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a9beb3"/><stop offset="1" stop-color="#7e9589"/></linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7a09d"/><stop offset="1" stop-color="#b97576"/></linearGradient>
  <linearGradient id="blush" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffc0b8"/><stop offset="1" stop-color="#ee9992"/></linearGradient>
  <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7cbbf"/><stop offset="1" stop-color="#829d90"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91a6af"/><stop offset="1" stop-color="#647d87"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8c6a4"/><stop offset="1" stop-color="#b8a178"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9eb4a7"/><stop offset="1" stop-color="#61756a"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="26" result="blur"/><feOffset in="blur" dy="24" result="offset"/><feFlood flood-color="#4b554e" flood-opacity=".22" result="color"/><feComposite in="color" in2="offset" operator="in" result="shade"/><feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/><feOffset in="blur" dy="10" result="offset"/><feFlood flood-color="#39443d" flood-opacity=".24" result="color"/><feComposite in="color" in2="offset" operator="in" result="shade"/><feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="chartClip"><circle cx="538" cy="382" r="205"/></clipPath>
 </defs>

 <rect x="34" y="34" width="956" height="956" rx="210" fill="url(#bg)" stroke="#ebe7e1" stroke-width="10" filter="url(#shadow)"/>

 <!-- Botanical accent -->
 <g filter="url(#soft)">
  <path d="M316 497C213 459 174 377 197 272c96 18 164 79 167 171-4 30-21 48-48 54z" fill="url(#leaf)"/>
  <path d="M306 473c-29-67-58-113-94-152" fill="none" stroke="#5f7066" stroke-width="12" stroke-linecap="round"/>
  <path d="M318 533c-91 7-156-35-190-122 83-32 157-9 195 62 12 25 11 45-5 60z" fill="url(#leaf)"/>
  <path d="M299 515c-58-38-103-62-143-72" fill="none" stroke="#5b6d62" stroke-width="11" stroke-linecap="round"/>
 </g>

 <!-- Segmented budget chart -->
 <g filter="url(#soft)">
  <circle cx="538" cy="382" r="220" fill="#fffaf4"/>
  <g clip-path="url(#chartClip)" stroke="#fffaf4" stroke-width="13" stroke-linejoin="round">
   <path d="M538 382V165A217 217 0 0 1 730 280Z" fill="url(#blush)"/>
   <path d="M538 382L730 280A217 217 0 0 1 722 505Z" fill="url(#sage)"/>
   <path d="M538 382L722 505A217 217 0 0 1 605 589Z" fill="url(#gold)"/>
   <path d="M538 382L605 589A217 217 0 0 1 351 497Z" fill="url(#blue)"/>
   <path d="M538 382L351 497A217 217 0 0 1 538 165Z" fill="url(#rose)"/>
  </g>
  <circle cx="538" cy="382" r="102" fill="#fffaf4"/>
  <path d="M538 443c-14-13-61-48-61-83 0-27 35-43 61-13 26-30 61-14 61 13 0 35-47 70-61 83z" fill="#60665a"/>
 </g>

 <!-- Wallet interior and back -->
 <path d="M268 485c10-52 55-85 109-85h364c61 0 103 45 103 104v301H268z" fill="#52645b" filter="url(#soft)"/>
 <path d="M274 496c22 45 93 62 204 65 147 4 278-21 365-67v91H274z" fill="url(#walletRim)"/>

 <!-- Wallet body -->
 <path d="M244 497c0-25 20-44 45-44 75 61 190 79 323 61 83-11 161-37 229-72v319c0 75-51 126-126 126H370c-80 0-126-48-126-126z" fill="url(#wallet)" filter="url(#shadow)"/>
 <path d="M255 504c47 38 120 60 212 65 147 8 278-20 374-73" fill="none" stroke="#bfd1c6" stroke-width="16" stroke-linecap="round" opacity=".75"/>
 <path d="M270 836c31 31 69 39 112 39h332c58 0 91-28 111-67" fill="none" stroke="#687d72" stroke-width="12" opacity=".48"/>

 <!-- Closing strap -->
 <g filter="url(#soft)">
  <path d="M690 631h162c40 0 66 28 66 65v72c0 37-27 64-66 64H690c-44 0-72-29-72-72v-57c0-44 28-72 72-72z" fill="url(#strap)"/>
  <path d="M681 654h164c27 0 47 19 47 45v65c0 26-20 45-47 45H681c-28 0-43-18-43-45v-65c0-27 15-45 43-45z" fill="none" stroke="#b9ccc1" stroke-width="7" stroke-dasharray="16 14" stroke-linecap="round" opacity=".8"/>
  <circle cx="747" cy="732" r="32" fill="url(#blush)" stroke="#f8d0ca" stroke-width="6"/>
 </g>
</svg>
